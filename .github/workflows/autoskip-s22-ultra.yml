name: AUTO SKIP S22 Ultra APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'AUTO_SKIP_S22_ULTRA/**'
      - '.github/workflows/autoskip-s22-ultra.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore AUTO SKIP source
        run: |
          cat AUTO_SKIP_S22_ULTRA/source.part-* > /tmp/autoskip-source.tar.gz.b64
          base64 -d /tmp/autoskip-source.tar.gz.b64 > /tmp/autoskip-source.tar.gz
          tar -xzf /tmp/autoskip-source.tar.gz -C AUTO_SKIP_S22_ULTRA
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: AUTO_SKIP_S22_ULTRA
      - name: Package install ZIP
        run: |
          test -s AUTO_SKIP_S22_ULTRA/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist/AUTO_SKIP_S22_ULTRA
          cp AUTO_SKIP_S22_ULTRA/app/build/outputs/apk/debug/app-debug.apk dist/AUTO_SKIP_S22_ULTRA/AUTO_SKIP_S22_ULTRA.apk
          cat > dist/AUTO_SKIP_S22_ULTRA/설치방법.txt <<'GUIDE'
          AUTO SKIP - Galaxy S22 Ultra
          1. ZIP 압축을 풉니다.
          2. AUTO_SKIP_S22_ULTRA.apk를 눌러 설치합니다.
          3. 설치 차단 시 이 출처의 앱 설치를 허용합니다.
          4. 앱 안내에 따라 접근성 서비스를 켭니다.
          5. OCR 사용 시 화면 캡처 권한을 승인합니다.
          6. 갤럭시 모드 및 루틴에서 충전 연결 조건에 AUTO SKIP 실행을 지정합니다.
          GUIDE
          cd dist
          zip -qr ../AUTO_SKIP_INSTALL.zip AUTO_SKIP_S22_ULTRA
      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AUTO_SKIP_S22_ULTRA_INSTALL_ZIP
          path: AUTO_SKIP_INSTALL.zip
          if-no-files-found: error
          retention-days: 30
